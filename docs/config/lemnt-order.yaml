# Nacos Data ID: lemnt-order.yaml，组/命名空间与本服务启动配置保持一致。
# 仅配置源；先核对迁移与旧写入方，再部署。连接信息必须由环境注入。
# Redis、认证、指标等公共配置沿用lemnt-common.yaml，保留旧结算恢复键与锁命名空间。
spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${ORDER_DB_URL}
          username: ${ORDER_DB_USERNAME}
          password: ${ORDER_DB_PASSWORD}

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    parameters:
      namespace: ${NACOS_NAMESPACE:}
      group: ${NACOS_GROUP:DEFAULT_GROUP}
  protocol:
    name: dubbo
    port: ${ORDER_DUBBO_PORT:20886}
  consumer:
    # 资金/资源结果未知时由应用按原业务号查询，不做框架层隐式写重试。
    retries: 0
    timeout: ${DUBBO_TIMEOUT_MS:10000}

commerce:
  outbox:
    # 审核完成后与正式消费者一起开启；停用不会删除原待投递记录。
    enabled: ${COMMERCE_OUTBOX_ENABLED:false}
    interval-ms: ${COMMERCE_OUTBOX_INTERVAL_MS:5000}

lemnt:
  order:
    recovery:
      enabled: ${ORDER_RECOVERY_ENABLED:false}
      interval-ms: ${ORDER_RECOVERY_INTERVAL_MS:5000}
    legacy-rollback:
      enabled: false
  # 历史配置键保留，归属已迁到order；不得让旧trade调度器同时执行。
  trade:
    scheduler:
      enabled: ${ORDER_SCHEDULER_ENABLED:false}
    auto-receive:
      enabled: ${ORDER_AUTO_RECEIVE_ENABLED:false}
    auto-comment:
      enabled: ${ORDER_AUTO_COMMENT_ENABLED:false}
