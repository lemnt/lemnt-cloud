<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout baseline v1</title><style>body{font:14px system-ui;background:#f4f6f9;color:#172033;margin:0}main{max-width:1100px;margin:32px auto;padding:24px}section{background:white;margin:18px 0;padding:24px;border-radius:10px}button,input,select{padding:9px 14px;border:1px solid #d9dfe9;border-radius:6px}button{cursor:pointer;background:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:16px;border-bottom:1px solid #edf0f5}.note{color:#687588}label{display:block;margin:12px 0}dialog{border:0;border-radius:10px;padding:24px;width:min(500px,85vw)}</style><main><h1>后台会员购物车与结算</h1><p class="note">设计示例 v1，未连接业务数据；实际页面复用现有 Ant Design 组件。</p><section><label>目标会员编号 <input placeholder="明确指定目标会员，不是当前后台账号"></label><button>查询购物车</button><button onclick="document.querySelector('dialog').showModal()">优惠券模板与发放说明</button></section><section><h2>购物车</h2><table><tr><th>SKU</th><th>数量</th><th>服务器价格</th><th>选中</th><th>操作</th></tr><tr><td>示例 SKU</td><td>2</td><td>以真实接口为准</td><td><input type="checkbox" checked></td><td><button>修改</button><button>删除</button></td></tr></table><label>优惠券 <select><option>实际会员优惠券接口供数</option></select></label><button>服务器重新计价</button></section><section><h2>结算预览</h2><p>原金额 / 优惠金额 / 应付金额：等待服务器报价</p><p class="note">提交前记录稳定请求编号；未知结果只重试原请求。成功返回 RESERVING，查询库存确认后状态。</p><button disabled>确认提交（设计示例，不执行）</button></section><dialog><h2>优惠券模板</h2><p>规则：满减或折扣、门槛、固定有效期、总发放数。每会员每模板限一张。所有金额由服务器精确计算。</p><p>已锁定订单在付款时核销，关单时释放。发放必须明确输入目标会员编号。</p><button onclick="document.querySelector('dialog').close()">关闭</button></dialog></main></html>
