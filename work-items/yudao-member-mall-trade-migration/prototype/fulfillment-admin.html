<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>履约后台布局参考 v1</title><style>body{font:16px system-ui;margin:32px;color:#222}table{border-collapse:collapse;width:100%}td,th{padding:16px;border:1px solid #ddd}aside{background:#fffbe6;padding:16px}button,input{padding:8px;margin:8px}dialog{width:480px}label{display:block}</style><h1>订单履约 / 设计参考</h1><aside>以下为示例布局，不连接服务。退款申请不代表已退款。</aside><p><label>订单编号<input placeholder="精确订单号"></label>状态 <select><option>全部</option><option>已支付</option><option>已发货</option><option>已完成</option></select><button>查询</button></p><table><tr><th>订单</th><th>金额</th><th>状态</th><th>库存确认</th><th>退款申请</th><th>操作</th></tr><tr><td>示例 TR1</td><td>17.00元</td><td>已支付</td><td>完成</td><td>无</td><td><button onclick="document.querySelector('dialog').showModal()">登记发货</button><button>登记退款申请</button></td></tr></table><h2>退款申请队列</h2><p>待处理 / 已驳回；可查看原因与驳回，无“退款成功”操作。</p><dialog><h2>登记发货</h2><p>仅库存确认完成且无待处理退款的订单可发货。物流信息不可改写。</p><label>承运商<input></label><label>运单号<input></label><label>收件人<input></label><label>电话<input></label><label>地址<input></label><button onclick="document.querySelector('dialog').close()">关闭参考弹窗</button></dialog></html>
