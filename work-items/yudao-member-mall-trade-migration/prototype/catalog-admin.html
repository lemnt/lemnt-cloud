<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog design baseline v1</title>
<style>body{font:14px system-ui;background:#f4f6f9;color:#172033;margin:0}main{max-width:1100px;margin:40px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:12px;margin:24px 0}button{padding:9px 18px;border:1px solid #d9dfe9;border-radius:6px;background:white;cursor:pointer}button.primary{background:#1677ff;color:white;border-color:#1677ff}.card{background:white;padding:24px;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:16px;border-bottom:1px solid #edf0f5}.note{color:#687588}dialog{border:0;border-radius:12px;width:min(600px,85vw);padding:24px}dialog::backdrop{background:#17203366}label{display:block;margin:16px 0 6px}input,select,textarea{padding:9px;border:1px solid #cbd3e1;border-radius:5px;width:95%}.actions{text-align:right;margin-top:24px}.status{color:#875400;background:#fff5d3;padding:4px 8px;border-radius:4px}</style>
<main><header><div><h1>商城商品管理</h1><p class="note">设计基线 v1 · 此页面为交互说明，未连接业务数据</p></div><button class="primary" onclick="document.querySelector('dialog').showModal()">新增商品</button></header><nav><button onclick="show('SPU 商品')">SPU 商品</button><button onclick="show('商品分类')">商品分类</button><button onclick="show('商品品牌')">商品品牌</button></nav><section class="card"><h2 id="section">SPU 商品</h2><p class="note">列表：名称检索、上下架筛选、分页；分类／品牌页沿用相同组件规范。</p><table><thead><tr><th>编码</th><th>名称</th><th>分类／品牌</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>设计示例</td><td>示例商品</td><td>实际接口返回后显示</td><td><span class="status">未上架</span></td><td><button onclick="document.querySelector('dialog').showModal()">详情与 SKU</button></td></tr></tbody></table><p class="note">空数据：显示空态；加载失败：保留查询条件并提供重试；无权限：不发起读取请求。</p></section>
<dialog><h2>商品与 SKU 编辑</h2><p class="note">表单字段严格对应 Req；库存只通过独立增减表单调整。</p><label>商品名称<input placeholder="必填，最多 200 字符"></label><label>分类<select><option>仅示例：实际使用启用的分类选项</option></select></label><label>品牌<select><option>仅示例：实际使用启用的品牌选项</option></select></label><label>SKU 规格 JSON<textarea placeholder='{"颜色":"红色","尺寸":"M"}'></textarea></label><label>价格（元）<input type="number" min="0.01" step="0.01"></label><label>库存增减量（仅在库存调整时显示）<input type="number" step="1"></label><p class="note">失败时保留输入与库存请求编号；保存成功后刷新数据。实际实现复用 AdminModalForm。</p><div class="actions"><button onclick="document.querySelector('dialog').close()">关闭设计示例</button></div></dialog></main><script>function show(name){document.getElementById('section').textContent=name}</script></html>
