server:
  port: ${MEMBER_PORT:9110}
spring:
  application:
    name: lemnt-member
  profiles:
    active: @profile.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:123456}
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
        file-extension: yaml
  config:
    import:
      - optional:nacos:lemnt-common.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
      - optional:nacos:commerce-mq.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
      - optional:nacos:lemnt-member.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
dubbo:
  application:
    name: ${spring.application.name}-provider
  registry:
    address: nacos://${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}?namespace=@profile.active@&group=DEFAULT_GROUP&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:123456}
# 微信小程序凭证：仅用于 wx.login 的 code 换取 openid；appId 必须与支付渠道配置一致。
member:
  wechat:
    app-id: ${MEMBER_WECHAT_APP_ID:}
    secret: ${MEMBER_WECHAT_SECRET:}
