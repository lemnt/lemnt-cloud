server:
  port: 9300

spring:
  application:
    name: lemnt-open
  profiles:
    active: @profile.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:123456}
      discovery:
        server-addr: ${NACOS_HOST:nacos-server}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:nacos-server}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:lemnt-common.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
      - optional:nacos:lemnt-open.yaml?namespace=@profile.active@&group=DEFAULT_GROUP

dubbo:
  application:
    name: ${spring.application.name}-provider
  registry:
    address: nacos://${NACOS_HOST:nacos-server}:${NACOS_PORT:8848}?namespace=@profile.active@&group=DEFAULT_GROUP&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:123456}
