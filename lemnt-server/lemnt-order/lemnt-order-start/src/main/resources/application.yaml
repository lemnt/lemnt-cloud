server:
  port: ${ORDER_PORT:9160}
spring:
  application:
    name: lemnt-order
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:lemnt-common.yaml
      - optional:nacos:lemnt-order.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
