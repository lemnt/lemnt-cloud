server:
  port: 9140

spring:
  application:
    name: lemnt-product
  profiles:
    active: @profile.active@
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:123456}
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: @profile.active@
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:lemnt-common.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
      - optional:nacos:lemnt-product.yaml?namespace=@profile.active@&group=DEFAULT_GROUP
